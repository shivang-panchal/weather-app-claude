name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
        env:
          VITE_WEATHER_KEY: ${{ secrets.VITE_WEATHER_KEY }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          VITE_WEATHER_KEY: ${{ secrets.VITE_WEATHER_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_WEATHER_KEY: ${{ secrets.VITE_WEATHER_KEY }}

  production-gate:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.base_ref == 'main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check all Jira bugs are resolved before deploying
        run: npm run gate:production
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
